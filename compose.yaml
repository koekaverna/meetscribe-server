services:
  server:
    container_name: meetscribe-server
    build: .
    image: meetscribe-server:local
    pull_policy: build
    restart: unless-stopped
    # No authentication: bind to localhost only. A MeetScribe container on the same host
    # reaches it as http://host.docker.internal:8000.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Hugging Face model cache. Create it once: docker volume create hf-hub-cache
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    environment:
      STT_MODEL: deepdml/faster-whisper-large-v3-turbo-ct2
      # Models a request may switch to. MeetScribe names its model in every request.
      STT_ALLOWED_MODELS: Systran/faster-whisper-medium
      LOG_LEVEL: info
      REQUIRE_GPU: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-hub-cache:
    name: hf-hub-cache
    external: true
